name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The tool is macOS-only (launchd, osascript, plutil) and the launch-agent
    # tests shell out to /usr/bin/plutil, so a macOS runner is required.
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Run the compiled tests directly; npm test would rebuild what the
      # previous step just produced.
      - run: node --test dist/test/*.test.js
